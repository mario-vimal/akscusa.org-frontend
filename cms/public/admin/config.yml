# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  # Deliberately not a real repository. The GitHub backend commits to whatever
  # this names, including from a local dev server, so the live site is never the
  # default. Set CMS_REPO to publish from a deployment, or to point a local dev
  # server at your own fork. See "Backend repository" in README.md.
  repo: OWNER/REPOSITORY
  branch: main
  # Sveltia uses the commit message as the pull request title. The defaults are
  # `Create/Update/Delete {{collection}} “{{slug}}”`; these name the CMS as the
  # source so the change is recognisable in the pull request list.
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Remove {{collection}}: {{slug}}"
    uploadMedia: "Add media: {{path}}"
    deleteMedia: "Remove media: {{path}}"
  # Land each entry as a single commit instead of one per intermediate save.
  squash_merges: true

# Route every change through a pull request rather than committing straight to
# `branch` above. Saving an entry opens a branch and a draft pull request, and
# nothing reaches `main` until the entry is published from the CMS or the pull
# request is merged.
publish_mode: editorial_workflow

# `cms/public/` is the Astro public directory, so uploads here are published at
# `/media/`. Sveltia requires this even when a cloud media library is added.
media_folder: /cms/public/media
public_folder: /media

# Only repeating, structured records belong here. Static page copy stays in
# `app/content/pages/` and is edited in Git, not through the CMS.
#
# The editorial collections below share a common set of fields — title, date,
# summary, topics,
# hero image, source URL, featured, draft — and each adds only what its own kind
# of entry needs. Their option lists mirror `app/features/editorial/taxonomy.ts`,
# and `scripts/cms/config.test.ts` fails if the two drift apart.
collections:
  - name: articles
    label: Blog
    label_singular: Article
    icon: article
    description: Essays and analysis, newest first.
    folder: cms/content/articles
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title, category]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Publication date, widget: datetime }
      - name: category
        label: Category
        widget: select
        options:
          - { label: Ambedkarite Thought, value: ambedkarite-thought }
          - { label: Caste in the USA, value: caste-in-the-usa }
          - { label: History and Movements, value: history-and-movements }
          - { label: Culture and Society, value: culture-and-society }
          - { label: Books and Media, value: books-and-media }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the blog index and in search results.
      - name: authors
        label: Authors
        widget: list
        required: false
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string, required: false }
      - name: topics
        label: Topics
        widget: select
        multiple: true
        required: false
        options: &editorial_topics
          - { label: Caste discrimination, value: caste-discrimination }
          - { label: Dr. Ambedkar, value: ambedkar }
          - { label: Periyar, value: periyar }
          - { label: Legislation, value: legislation }
          - { label: Litigation, value: litigation }
          - { label: Workplace, value: workplace }
          - { label: Higher education, value: higher-education }
          - { label: Solidarity, value: solidarity }
          - { label: History, value: history }
          - { label: Religion and culture, value: religion-and-culture }
          - { label: Hindutva, value: hindutva }
          - { label: Civil rights, value: civil-rights }
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: &hero_image_fields
          - {
              name: src,
              label: Image URL,
              widget: string,
              hint: Full URL of an image on the media host.,
            }
          - {
              name: alt,
              label: Alternative text,
              widget: string,
              hint: Describe the image. Leave empty only if it is decorative.,
            }
      - {
          name: sourceUrl,
          label: Original URL,
          widget: string,
          required: false,
          hint: Where this was first published,
          if it is being republished here.,
        }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Article, widget: markdown }

  - name: press-releases
    label: Press Releases
    label_singular: Press Release
    icon: campaign
    description: Public statements issued by AKSC, newest first.
    folder: cms/content/press-releases
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Release date, widget: datetime }
      - name: dateline
        label: Dateline
        widget: string
        required: false
        hint: Place of issue, such as “San Jose, California”.
      - name: issuedBy
        label: Issued by
        widget: list
        field: { name: organization, label: Organization, widget: string }
        default: [Ambedkar King Study Circle]
        hint: Every organization the statement is issued in the name of.
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the press release index.
      - name: contactEmail
        label: Press contact email
        widget: string
        required: false
      - name: topics
        label: Topics
        widget: select
        multiple: true
        required: false
        options: *editorial_topics
      - name: attachments
        label: Attachments
        widget: list
        required: false
        fields: &link_fields
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: *hero_image_fields
      - {
          name: sourceUrl,
          label: Original URL,
          widget: string,
          required: false,
        }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Statement, widget: markdown }

  - name: interventions
    label: Interventions
    label_singular: Intervention
    icon: gavel
    description: Campaigns, legal work, and public education, newest first.
    folder: cms/content/interventions
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title, status]
    view_filters:
      - { label: Ongoing, field: status, pattern: ongoing }
      - { label: Concluded, field: status, pattern: concluded }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Start date, widget: datetime }
      - name: kind
        label: Kind
        widget: select
        options:
          - { label: Legislative, value: legislative }
          - { label: Legal, value: legal }
          - { label: Campaign, value: campaign }
          - { label: Education, value: education }
          - { label: Testimony, value: testimony }
      - name: status
        label: Status
        widget: select
        default: ongoing
        options:
          - { label: Ongoing, value: ongoing }
          - { label: Concluded, value: concluded }
      - name: concludedDate
        label: Concluded on
        widget: datetime
        required: false
        hint: Fill this in once the status is set to concluded.
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the interventions index.
      - name: outcome
        label: Outcome
        widget: text
        required: false
        hint: What the intervention achieved. Shown on concluded entries.
      - name: topics
        label: Topics
        widget: select
        multiple: true
        required: false
        options: *editorial_topics
      - name: resources
        label: Resources
        widget: list
        required: false
        fields: *link_fields
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: *hero_image_fields
      - {
          name: sourceUrl,
          label: Original URL,
          widget: string,
          required: false,
        }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Details, widget: markdown }

  - name: conferences
    label: Conferences
    label_singular: Conference
    icon: groups
    description: Annual conferences, newest first.
    folder: cms/content/conferences
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title, edition]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Start date, widget: datetime }
      - name: endDate
        label: End date
        widget: datetime
        required: false
        hint: Only needed for a conference that runs over more than one day.
      - name: edition
        label: Edition
        widget: number
        required: false
        value_type: int
        min: 1
        hint: Which annual conference this is, counting from the first in 2018.
      - name: format
        label: Format
        widget: select
        default: in-person
        options:
          - { label: In person, value: in-person }
          - { label: Online, value: online }
          - { label: Hybrid, value: hybrid }
      - { name: location, label: Location, widget: string, required: false }
      - { name: theme, label: Theme, widget: string, required: false }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the conferences index.
      - name: registrationUrl
        label: Registration URL
        widget: string
        required: false
      - name: topics
        label: Topics
        widget: select
        multiple: true
        required: false
        options: *editorial_topics
      - name: speakers
        label: Speakers
        widget: relation
        required: false
        multiple: true
        collection: speakers
        value_field: "{{slug}}"
        search_fields: [name, role]
        display_fields: [name, role]
      - name: resources
        label: Resources
        widget: list
        required: false
        fields: *link_fields
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: *hero_image_fields
      - {
          name: sourceUrl,
          label: Original URL,
          widget: string,
          required: false,
        }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Programme, widget: markdown }

  - name: speakers
    label: Speakers
    label_singular: Speaker
    icon: record_voice_over
    description: Reusable speaker biographies referenced by conferences.
    folder: cms/content/speakers
    create: true
    slug: "{{slug}}"
    sortable_fields: [name, role]
    summary: "{{name}} — {{role}}"
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string }
      - name: bio
        label: Biography
        widget: text
        hint: Separate paragraphs with a blank line.
      - name: portrait
        label: Portrait
        widget: object
        required: false
        collapsed: true
        fields:
          - {
              name: src,
              label: R2 image URL,
              widget: string,
              hint: "Use the public media.akscusa.org URL after uploading the portrait to R2.",
            }
          - {
              name: alt,
              label: Alternative text,
              widget: string,
              hint: Describe the person and setting rather than repeating their name.,
            }
      - {
          name: sourceUrl,
          label: Original biography URL,
          widget: string,
          required: false,
        }
      - { name: draft, label: Draft, widget: boolean, default: false }

  - name: programs
    label: Programs
    label_singular: Program
    icon: event
    description: Public events and longer-running initiatives, newest first.
    folder: cms/content/programs
    create: true
    slug: "{{slug}}"
    media_folder: /cms/public/media/programs
    public_folder: /media/programs
    sortable_fields: [date, title, kind, status]
    view_filters:
      - { label: Scheduled, field: status, pattern: scheduled }
      - { label: Concluded, field: status, pattern: concluded }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date or application deadline
        widget: datetime
        time_format: false
      - name: kind
        label: Kind
        widget: select
        options:
          - { label: Event, value: event }
          - { label: Initiative, value: initiative }
      - name: status
        label: Status
        widget: select
        default: scheduled
        options:
          - { label: Scheduled, value: scheduled }
          - { label: Concluded, value: concluded }
      - {
          name: schedule,
          label: Time,
          widget: string,
          required: false,
          hint: "Use the time and time zone shown in the announcement.",
        }
      - { name: location, label: Location, widget: string, required: false }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the programs index.
      - name: registrationUrl
        label: Registration URL
        widget: string
        required: false
        hint: Shown only while the program is scheduled.
      - name: topics
        label: Topics
        widget: select
        multiple: true
        required: false
        options: *editorial_topics
      - name: resources
        label: Resources
        widget: list
        required: false
        fields: *link_fields
      - name: posters
        label: Posters and flyers
        label_singular: Poster or flyer
        widget: list
        required: false
        summary: "{{fields.caption}}"
        fields:
          - {
              name: src,
              label: Image,
              widget: image,
              hint: "Keep AKSC posters in their original colors.",
            }
          - {
              name: alt,
              label: Alternative text,
              widget: string,
              hint: "Describe the information and people shown in the poster.",
            }
          - { name: caption, label: Caption, widget: string, required: false }
      - {
          name: sourceUrl,
          label: Original URL,
          widget: string,
          required: false,
        }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Details, widget: markdown }

  - name: books
    label: Books
    label_singular: Book
    icon: book_2
    description: >-
      One record per book the circle reads, identified by ISBN. Give the title,
      the authors, the ISBN and a summary; the cover art, subtitle, publisher
      and years are fetched from the ISBN after you save, so you can leave them
      blank and nothing needs uploading here.
    folder: cms/content/books
    create: true
    slug: "{{slug}}"
    sortable_fields: [title]
    summary: "{{title}} — {{isbn}}"
    fields:
      - { name: title, label: Title, widget: string }
      - name: subtitle
        label: Subtitle
        widget: string
        required: false
        hint: "Leave blank to take the subtitle listed for this ISBN."
      - name: authors
        label: Authors
        widget: list
        field: { name: name, label: Name, widget: string }
      - name: isbn
        label: ISBN-13
        widget: string
        pattern:
          [
            "^(97(8|9))?[0-9-]{10,17}$",
            "Enter the 13 digit ISBN of the edition read.",
          ]
        hint: "ISBN-13 of the edition the circle read. It links every reading to this book, so it must be correct."
      - name: publisher
        label: Publisher
        widget: string
        required: false
        hint: "Leave blank to take the publisher listed for this ISBN."
      - name: publishedYear
        label: Edition year
        widget: number
        required: false
        value_type: int
        hint: "Year of this edition. Leave blank to take the year listed for this ISBN."
      - name: firstPublishedYear
        label: First published
        widget: number
        required: false
        value_type: int
        hint: "Year the text first appeared, which for a reprint is not the edition year. Leave blank to take the year listed for this ISBN."
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the books index and in search results.
      - name: topics
        label: Topics
        widget: select
        multiple: true
        required: false
        options: *editorial_topics
      - name: resources
        label: Where to read it
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }
      - { name: draft, label: Draft, widget: boolean, default: false }

  - name: book-readings
    label: Book Readings
    label_singular: Book Reading
    icon: menu_book
    description: Scheduled and past readings, newest first.
    folder: cms/content/book-readings
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date and time, widget: datetime }
      - name: location
        label: Location
        widget: string
        hint: "Where the session met, or how to join it when it is held online."
      - name: book
        label: Book
        widget: relation
        required: false
        collection: books
        value_field: "{{slug}}"
        search_fields: [title, isbn, authors.*]
        display_fields: [title, authors.*]
        hint: "Pick the book by title. Leave empty for a session built on articles or papers rather than one book."
      - name: participants
        label: Participants
        widget: list
        required: false
        field: { name: name, label: Name, widget: string }
      - {
          name: registrationUrl,
          label: Registration URL,
          widget: string,
          required: false,
        }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the readings index and in search results.
      - name: topics
        label: Topics
        widget: select
        multiple: true
        required: false
        options: *editorial_topics
      - name: resources
        label: What we read
        widget: list
        required: false
        fields:
          - { name: label, label: Label, widget: string }
          - { name: url, label: URL, widget: string }
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: *hero_image_fields
      - name: sourceUrl
        label: Original URL
        widget: string
        required: false
        hint: "Where this reading was first published, kept so migrated copy is traceable."
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Details, widget: markdown, required: false }

  - name: general-body-meetings
    label: General Body Meetings
    label_singular: General Body Meeting
    icon: gavel
    description: >-
      One record per annual General Body meeting, holding the papers it
      published. A meeting always submits a report, and adopts resolutions only
      when there are any. Upload each PDF here; it is committed with the entry.
    folder: cms/content/general-body-meetings
    create: true
    slug: "{{fields.edition}}-general-body-meeting-{{year}}"
    # Uploads land beside the ones already committed, and are stored on the
    # entry as the `/media/general-body/...` path the site serves.
    media_folder: /cms/public/media/general-body
    public_folder: /media/general-body
    sortable_fields: [edition, date]
    summary: "General Body {{fields.edition}} — {{year}}"
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - name: edition
        label: Which meeting
        widget: number
        value_type: int
        min: 1
        hint: "Counting from the first in 2017. The page titles itself from this, for example 6 becomes “6th General Body Meeting”."
      - name: date
        label: Date
        widget: datetime
        time_format: false
      - name: datePrecision
        label: Date precision
        widget: select
        default: day
        options:
          - { label: Exact day, value: day }
          - { label: Month only, value: month }
        hint: "Choose month only when the record names a month but no day, so the page does not print a day that was never recorded."
      - name: location
        label: Location
        widget: string
        hint: "Where it was held, or “Online” for a meeting held virtually."
      - name: papers
        label: Papers
        widget: list
        label_singular: Paper
        summary: "{{fields.kind}}"
        fields:
          - name: kind
            label: Kind
            widget: select
            options:
              - { label: Report, value: report }
              - { label: Resolutions, value: resolutions }
          - name: file
            label: PDF
            widget: file
            hint: "Upload the PDF itself. It is committed to the repository and served from the site, so it keeps working once the old WordPress host is retired."
          - name: pageCount
            label: Pages
            widget: number
            required: false
            value_type: int
            min: 1
            hint: "Shown beside the link so a reader knows the size of the download before opening it."
      - name: sourceUrl
        label: Original URL
        widget: string
        required: false
        hint: "Where these papers were first published, kept so migrated copy is traceable."
      - { name: draft, label: Draft, widget: boolean, default: false }

  # Drawn work. A comic and a toolkit scenario are both a titled sequence of
  # panels, and both ask the same two things of whoever publishes one: describe
  # the drawing, and write out the words drawn inside it. A comic that carries
  # neither is closed to a screen reader, to translation, and to search, so the
  # panel list asks for both every time.
  #
  # Panels are uploaded into the repository rather than to a bucket, so a
  # published comic is a file this site serves and cannot be broken by somebody
  # else's host going away.
  - name: comics
    label: Comics
    label_singular: Comic
    icon: draw
    description: >-
      Illustrated comics, read panel by panel. Upload the panels in reading
      order; the first one is the cover shown on the comics index.
    folder: cms/content/comics
    create: true
    slug: "{{slug}}"
    media_folder: /cms/public/media/comics
    public_folder: /media/comics
    sortable_fields: [date, title]
    summary: "{{title}}"
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Publication date
        widget: datetime
        time_format: false
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the comics index and in search results.
      - name: credits
        label: Credits
        label_singular: Credit
        widget: list
        summary: "{{fields.name}}"
        hint: "Everyone whose work is in the comic. A comic is never published without a credit."
        fields: &credit_fields
          - { name: name, label: Name, widget: string }
          - {
              name: role,
              label: Role,
              widget: string,
              required: false,
              hint: "For example Art, Script, or Art and script.",
            }
          - {
              name: url,
              label: Link,
              widget: string,
              required: false,
              hint: "Where readers can find more of their work.",
            }
      - name: topics
        label: Topics
        widget: select
        multiple: true
        required: false
        options: *editorial_topics
      - name: contentNote
        label: Content note
        widget: string
        required: false
        hint: "Shown before the comic starts. Use it when a comic depicts violence or reproduces a slur."
      - name: panels
        label: Panels
        label_singular: Panel
        widget: list
        summary: "{{fields.alt}}"
        hint: "In reading order. The first panel is used as the cover."
        fields: &panel_fields
          - {
              name: src,
              label: Panel image,
              widget: image,
              hint: "Square panels at least 1140 pixels wide read best. Keep the artwork in its original colors.",
            }
          - name: alt
            label: Alternative text
            widget: string
            hint: "Describe the drawing: who is in it, where they are, and what they are doing. The words in the panel go in the transcript below, so do not repeat them here."
          - name: transcript
            label: Transcript
            widget: text
            required: false
            hint: "Every word drawn in the panel, in reading order, one line per bubble. Write “Aish: Hmmm.” to name who is speaking."
      - {
          name: sourceUrl,
          label: Original URL,
          widget: string,
          required: false,
        }
      - { name: featured, label: Featured, widget: boolean, default: false }
      - { name: draft, label: Draft, widget: boolean, default: false }

  - name: toolkit-scenarios
    label: Toolkit Scenarios
    label_singular: Scenario
    icon: forum
    description: >-
      Illustrated scenarios in the anti-caste toolkit. Each is a short situation
      that ends in a question to the reader, ordered by hand rather than by date
      because a playbook is read in the order its authors chose.
    folder: cms/content/toolkit-scenarios
    create: true
    slug: "{{slug}}"
    media_folder: /cms/public/media/anti-caste-toolkit
    public_folder: /media/anti-caste-toolkit
    sortable_fields: [order, title]
    summary: "{{order}}. {{title}}"
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - name: order
        label: Position in the playbook
        widget: number
        value_type: int
        min: 1
        hint: "Counting from 1. Scenarios are read in this order."
      - name: setting
        label: Setting
        widget: string
        hint: "Where it happens, in a few words, such as “A school cafeteria”."
      - name: summary
        label: Summary
        widget: text
        hint: One sentence saying what happens and what the reader is asked to consider.
      - name: prompt
        label: Question to the reader
        widget: text
        hint: "Printed under the panels, above the link to the form."
      - name: panels
        label: Panels
        label_singular: Panel
        widget: list
        summary: "{{fields.alt}}"
        hint: "In reading order."
        fields: *panel_fields
      - name: credits
        label: Credits
        label_singular: Credit
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields: *credit_fields
      - {
          name: sourceUrl,
          label: Original URL,
          widget: string,
          required: false,
        }
      - { name: draft, label: Draft, widget: boolean, default: false }
