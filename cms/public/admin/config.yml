# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.201.1/schema/sveltia-cms.json

backend:
  name: github
  # Deliberately not a real repository. The GitHub backend commits to whatever
  # this names, including from a local dev server, so the live site is never the
  # default. Set CMS_REPO to publish from a deployment, or to point a local dev
  # server at your own fork. See "Backend repository" in README.md.
  repo: OWNER/REPOSITORY
  branch: main
  # Sveltia uses the commit message as the pull request title. The defaults are
  # `Create/Update/Delete {{collection}} “{{slug}}”`; these name the CMS as the
  # source so the change is recognisable in the pull request list.
  commit_messages:
    create: "Add {{collection}}: {{slug}}"
    update: "Update {{collection}}: {{slug}}"
    delete: "Remove {{collection}}: {{slug}}"
    uploadMedia: "Add media: {{path}}"
    deleteMedia: "Remove media: {{path}}"
  # Land each entry as a single commit instead of one per intermediate save.
  squash_merges: true

# Entry saves use a pull request. Standalone media-library saves still write
# directly to the backend branch, so production branch protection must cover
# those writes as well.
publish_mode: editorial_workflow

# Published-entry previews need a live-site base even when no deployment
# status is available. Workflow deployment URLs override it for branch previews.
site_url: https://akscusa.org

# The same filename is the CMS relation value and the Astro content ID.
# Sveltia's ASCII normalizer preserves underscores and tildes; Astro loaders
# intentionally preserve that filename rather than run a second slugger.
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
  trim: true
  lowercase: true

# Entry-owned uploads live beside index.md. Only genuinely shared files use
# this global library; both are served as static /media/ assets.
# Owned media folders below use absolute templates because Sveltia otherwise
# serializes entry-relative files as bare names, ignoring public_folder.
media_folder: /cms/public/media/shared
public_folder: /media/shared

media_libraries: &repository_media
  all:
    slugify_filename: true
  default:
    config:
      slugify_filename: true
  cloudinary: false
  uploadcare: false
  aws_s3: false
  cloudflare_r2: false
  digitalocean_spaces: false
  backblaze_b2: false
  scaleway_object_storage: false
  supabase_storage: false
  stock_assets: false

# The picker offers this entry's owned media and the shared /media/shared/
# library. Changing a shared asset can affect several entries.

# Preview links open rendered site routes, not the generic CMS field preview.
# `draft: true` omits a record from every build, including deployment previews.
# Clear it to inspect the entry in a review-branch deployment; that does not
# merge the editorial-workflow pull request. Shared media is retained when an
# entry is deleted. Remove an asset only after checking every remaining use.

# Only repeating, structured records belong here. Static page copy stays in
# `app/content/pages/` and is edited in Git, not through the CMS.
#
# The editorial collections below share a common set of fields — title, date,
# summary, topics,
# hero image, source URL, featured, draft — and each adds only what its own kind
# of entry needs.
#
# Topics and Categories are vocabularies rather than pages: an entry in one is
# a term that other collections file themselves under, chosen through a
# relation widget so a term can only ever be picked, never mistyped. They are
# editable here because naming a new subject is editorial judgement. The
# structural lists that are not — an intervention's status, a program's kind —
# stay as `select` options mirroring `app/features/editorial/taxonomy.ts`, and
# `scripts/cms/config.test.ts` fails if those two drift apart.
collections:
  - name: articles
    label: Blog
    label_singular: Article
    icon: article
    description: Essays and analysis, newest first.
    folder: cms/content/articles
    path: "{{slug}}/index"
    media_folder: /cms/content/articles/{{slug}}
    public_folder: /media/articles/{{slug}}
    create: true
    slug: "{{slug}}"
    preview_path: /blog/{{slug}}/
    thumbnail: heroImage.src
    sortable_fields: [date, title, category]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - &calendar_date
        name: date
        label: Publication date
        widget: datetime
        type: date
        format: YYYY-MM-DD
      - name: category
        label: Category
        widget: relation
        collection: categories
        value_field: "{{slug}}"
        search_fields: [label, description]
        display_fields: [label]
        hint: "The shelf this article is filed under on the blog. Add a new category in the Categories collection if none of these fit."
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the blog index and in search results.
      - name: authors
        label: Authors
        widget: list
        required: false
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Role, widget: string, required: false }
      - &topics_field
        name: topics
        label: Topics
        widget: relation
        multiple: true
        required: false
        collection: topics
        value_field: "{{slug}}"
        search_fields: [label, description]
        display_fields: [label]
        hint: "Pick the subjects this is about from the Topics collection. Add one there first if the subject you need is not listed."
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: &hero_image_fields
          - &editorial_image
            name: src
            label: Image
            widget: image
            accept: .png,.jpg,.jpeg,.webp
            choose_url: true
            pattern:
              - "^(?:$|undefined|null|https?://[^\\s]+|(?:/media/(?:shared/(?:[a-z0-9_~-]+/)*|[a-z0-9_~-]+/[a-z0-9_~-]+/))?[a-z0-9_~-]+\\.(?:png|jpe?g|webp))$"
              - Upload or select a PNG, JPG, JPEG or WebP, or enter a genuine external HTTP(S) image URL.
            media_libraries: *repository_media
            hint: >-
              Upload an image beside this entry or select one from the shared
              media library. A genuine external image URL may also be used.
          - {
              name: alt,
              label: Alternative text,
              widget: string,
              hint: Describe the image. Leave empty only if it is decorative.,
            }
      - &external_source
        name: sourceUrl
        label: External source URL
        widget: string
        required: false
        hint: >-
          Optional link to a genuine external publication, biography or
          document. Leave blank when no external source applies.
      - { name: featured, label: Featured, widget: boolean, default: false }
      - &draft_field
        name: draft
        label: Draft
        widget: boolean
        default: false
        hint: >-
          Hides this entry from every build, including deployment previews.
          Turn this off to review the rendered entry on a branch preview.
          This switch is separate from the CMS workflow and does not
          publish the entry.
      - { name: body, label: Article, widget: markdown }

  - name: press-releases
    label: Press Releases
    label_singular: Press Release
    icon: campaign
    description: Public statements issued by AKSC, newest first.
    folder: cms/content/press-releases
    path: "{{slug}}/index"
    media_folder: /cms/content/press-releases/{{slug}}
    public_folder: /media/press-releases/{{slug}}
    create: true
    slug: "{{slug}}"
    preview_path: /press-releases/{{slug}}/
    thumbnail: heroImage.src
    sortable_fields: [date, title]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - { <<: *calendar_date, label: Release date }
      - name: dateline
        label: Dateline
        widget: string
        required: false
        hint: Place of issue, such as “San Jose, California”.
      - name: issuedBy
        label: Issued by
        widget: list
        field: { name: organization, label: Organization, widget: string }
        default: [Ambedkar King Study Circle]
        hint: Every organization the statement is issued in the name of.
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the press release index.
      - name: contactEmail
        label: Press contact email
        widget: string
        required: false
      - *topics_field
      - name: attachments
        label: Attachments
        widget: list
        required: false
        fields: &link_fields
          - { name: label, label: Label, widget: string }
          - &resource_url
            name: url
            label: Document or link
            widget: file
            accept: .pdf,.png,.jpg,.jpeg,.webp
            choose_url: true
            media_libraries: *repository_media
            pattern:
              - "^(?:https?://[^\\s]+|#[^\\s\\\\]+|(?:/media/(?:shared/(?:[a-z0-9_~-]+/)*|[a-z0-9_~-]+/[a-z0-9_~-]+/))?[a-z0-9_~-]+\\.(?:pdf|png|jpe?g|webp)(?:[?#][^\\s\\\\]*)?|/(?!/|media(?:/|[?#]|$))[^\\s\\\\]*)$"
              - Upload or select a PDF or image, or enter a valid HTTP(S) URL or site-relative page link.
            hint: >-
              Upload a PDF or image beside this entry, select a shared file,
              or enter an HTTP(S) URL or site-relative page link.
              Keep any document fragment, such as #page=2, when it
              helps readers.
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: *hero_image_fields
      - *external_source
      - { name: featured, label: Featured, widget: boolean, default: false }
      - *draft_field
      - { name: body, label: Statement, widget: markdown }

  - name: interventions
    label: Interventions
    label_singular: Intervention
    icon: gavel
    description: Campaigns, legal work, and public education, newest first.
    folder: cms/content/interventions
    path: "{{slug}}/index"
    media_folder: /cms/content/interventions/{{slug}}
    public_folder: /media/interventions/{{slug}}
    create: true
    slug: "{{slug}}"
    preview_path: /interventions/{{slug}}/
    thumbnail: heroImage.src
    sortable_fields: [date, title, status]
    view_filters:
      - { label: Ongoing, field: status, pattern: ongoing }
      - { label: Concluded, field: status, pattern: concluded }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - { <<: *calendar_date, label: Start date }
      - name: kind
        label: Kind
        widget: select
        options:
          - { label: Legislative, value: legislative }
          - { label: Legal, value: legal }
          - { label: Campaign, value: campaign }
          - { label: Education, value: education }
          - { label: Testimony, value: testimony }
      - name: status
        label: Status
        widget: select
        default: ongoing
        options:
          - { label: Ongoing, value: ongoing }
          - { label: Concluded, value: concluded }
      - name: concludedDate
        <<: *calendar_date
        label: Concluded on
        required: false
        hint: Fill this in once the status is set to concluded.
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the interventions index.
      - name: outcome
        label: Outcome
        widget: text
        required: false
        hint: What the intervention achieved. Shown on concluded entries.
      - *topics_field
      - name: resources
        label: Resources
        widget: list
        required: false
        fields: *link_fields
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: *hero_image_fields
      - *external_source
      - { name: featured, label: Featured, widget: boolean, default: false }
      - *draft_field
      - { name: body, label: Details, widget: markdown }

  - name: conferences
    label: Conferences
    label_singular: Conference
    icon: groups
    description: Annual conferences, newest first.
    folder: cms/content/conferences
    path: "{{slug}}/index"
    media_folder: /cms/content/conferences/{{slug}}
    public_folder: /media/conferences/{{slug}}
    create: true
    slug: "{{slug}}"
    preview_path: /conferences/{{slug}}/
    thumbnail: heroImage.src
    sortable_fields: [date, title, edition]
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - { <<: *calendar_date, label: Start date }
      - name: endDate
        <<: *calendar_date
        label: End date
        required: false
        hint: Only needed for a conference that runs over more than one day.
      - name: edition
        label: Edition
        widget: number
        required: false
        value_type: int
        min: 1
        hint: Which annual conference this is, counting from the first in 2018.
      - name: format
        label: Format
        widget: select
        default: in-person
        options:
          - { label: In person, value: in-person }
          - { label: Online, value: online }
          - { label: Hybrid, value: hybrid }
      - { name: location, label: Location, widget: string, required: false }
      - { name: theme, label: Theme, widget: string, required: false }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the conferences index.
      - name: registrationUrl
        label: Registration URL
        widget: string
        required: false
      - *topics_field
      - name: speakers
        label: Speakers
        widget: relation
        required: false
        multiple: true
        collection: speakers
        value_field: "{{slug}}"
        search_fields: [name, role]
        display_fields: [name, role]
      - name: resources
        label: Resources
        widget: list
        required: false
        fields: *link_fields
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: *hero_image_fields
      - *external_source
      - { name: featured, label: Featured, widget: boolean, default: false }
      - *draft_field
      - { name: body, label: Programme, widget: markdown }

  - name: speakers
    label: Speakers
    label_singular: Speaker
    icon: record_voice_over
    description: Reusable speaker biographies referenced by conferences.
    folder: cms/content/speakers
    path: "{{slug}}/index"
    media_folder: /cms/content/speakers/{{slug}}
    public_folder: /media/speakers/{{slug}}
    create: true
    # `{{slug}}` slugifies the identifier field, which Sveltia takes to be
    # `title` unless it is named. This collection has no `title`, so without
    # this a new speaker would be filed under a random UUID.
    identifier_field: name
    slug: "{{slug}}"
    # A biography appears only inside conferences that select this speaker.
    # There is no standalone speaker URL or single authoritative conference.
    preview_path: /conferences/
    sortable_fields: [name, role]
    summary: "{{name}} — {{role}}"
    # A thumbnail is picked from top-level `image` and `file` fields only, and
    # every picture on this site hangs off an object or a list so it can carry
    # its own alt text. Naming the path is what puts the face on the card.
    thumbnail: portrait.src
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role, widget: string }
      - name: bio
        label: Biography
        widget: text
        hint: Separate paragraphs with a blank line.
      - name: portrait
        label: Portrait
        widget: object
        required: false
        collapsed: true
        fields:
          - { <<: *editorial_image, label: Portrait image }
          - {
              name: alt,
              label: Alternative text,
              widget: string,
              hint: Describe the person and setting rather than repeating their name.,
            }
      - *external_source
      - *draft_field

  - name: programs
    label: Programs
    label_singular: Program
    icon: event
    description: Public events and longer-running initiatives, newest first.
    folder: cms/content/programs
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    preview_path: /programs/{{slug}}/
    media_folder: /cms/content/programs/{{slug}}
    public_folder: /media/programs/{{slug}}
    sortable_fields: [date, title, kind, status]
    # The first flyer, which is the one the program was announced with.
    thumbnail: posters.*.src
    view_filters:
      - { label: Scheduled, field: status, pattern: scheduled }
      - { label: Concluded, field: status, pattern: concluded }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        <<: *calendar_date
        label: Date or application deadline
      - name: kind
        label: Kind
        widget: select
        options:
          - { label: Event, value: event }
          - { label: Initiative, value: initiative }
      - name: status
        label: Status
        widget: select
        default: scheduled
        options:
          - { label: Scheduled, value: scheduled }
          - { label: Concluded, value: concluded }
      - {
          name: schedule,
          label: Time,
          widget: string,
          required: false,
          hint: "Use the time and time zone shown in the announcement.",
        }
      - { name: location, label: Location, widget: string, required: false }
      - name: organisers
        label: Organised by
        widget: list
        required: false
        field: { name: name, label: Organisation, widget: string }
        hint: >-
          Every organisation that convened the program, as the flyer credits
          them. AKSC organises in coalition, so name the partners too.
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the programs index.
      - name: registrationUrl
        label: Registration URL
        widget: string
        required: false
        hint: Shown only while the program is scheduled.
      - *topics_field
      - name: resources
        label: Resources
        widget: list
        required: false
        fields: *link_fields
      - name: posters
        label: Posters and flyers
        label_singular: Poster or flyer
        widget: list
        required: false
        summary: "{{fields.caption}}"
        fields: &poster_fields
          - &local_image
            name: src
            label: Image
            widget: image
            accept: .png,.jpg,.jpeg,.webp
            choose_url: false
            # For pending uploads Sveltia validates the normalized filename,
            # not the eventual public path. Optional media can also be unset.
            # `accept` filters uploads, but not already-uploaded library items.
            pattern:
              - "^(?:$|undefined|null|(?:/media/(?:shared/(?:[a-z0-9_~-]+/)*|[a-z0-9_~-]+/[a-z0-9_~-]+/))?[a-z0-9_~-]+\\.(?:png|jpe?g|webp))$"
              - Choose a PNG, JPG, JPEG or WebP from this site's media library. New uploads are named automatically.
            media_libraries: *repository_media
            hint: "Keep AKSC posters in their original colors."
          - {
              name: alt,
              label: Alternative text,
              widget: string,
              hint: "Describe the information and people shown in the poster.",
            }
          - { name: caption, label: Caption, widget: string, required: false }
      - *external_source
      - { name: featured, label: Featured, widget: boolean, default: false }
      - *draft_field
      - { name: body, label: Details, widget: markdown }

  - name: books
    label: Books
    label_singular: Book
    icon: book_2
    description: >-
      One complete record per book the circle reads. The filename is the book's
      permanent address and what readings link to, so choose it before
      publishing. Enter the title, edition details, and AKSC's own summary here.
      Upload a cover to this collection when one is available. Authors are
      selected from the Authors collection, and should be added there first if
      they are new.
    folder: cms/content/books
    path: "{{slug}}/index"
    media_folder: /cms/content/books/{{slug}}
    public_folder: /media/books/{{slug}}
    create: true
    slug: "{{slug}}"
    preview_path: /books/{{slug}}/
    sortable_fields: [title]
    summary: "{{title}}"
    fields:
      - name: title
        label: Title
        widget: string
        hint: "The book's title. Choose the filename before publishing because it sets the web address."
      - name: subtitle
        label: Subtitle
        widget: string
        required: false
        hint: "Subtitle on the edition, if it has one."
      - name: cover
        <<: *local_image
        label: Cover
        required: false
        hint: "Upload the cover of the edition the circle read. Keep the artwork in its original colors. A book with no cover simply shows none."
      - name: coverSource
        label: Cover source
        widget: object
        required: false
        collapsed: true
        hint: "Where the cover file came from. It prints under the picture. Leave empty if AKSC photographed the book itself."
        fields:
          - {
              name: label,
              label: Name of the source,
              widget: string,
              hint: "How the page should name it — “Open Library”.",
            }
          - {
              <<: *resource_url,
              label: Link,
              hint: "The page the file came from.",
            }
      - name: authors
        label: Authors
        widget: relation
        required: false
        multiple: true
        collection: authors
        value_field: "{{slug}}"
        search_fields: [name, aliases]
        display_fields: [name]
        hint: "Pick each author from the Authors collection. Add them there first if they are not listed — a name typed here would not link to their page. Search also matches the other spellings an author entry records."
      - name: isbn
        label: ISBN-13
        widget: string
        required: false
        pattern:
          [
            "^(?:$|[\\s-]*9[\\s-]*7[\\s-]*[89](?:[\\s-]*[0-9]){10}[\\s-]*)$",
            "Leave blank, or enter the 13-digit ISBN beginning 978 or 979. Spaces and hyphens are allowed; validation also checks the check digit.",
          ]
        hint: "ISBN-13 of the edition the circle read, if it has one. Leave blank for a pamphlet, a PDF, or an edition older than the ISBN system — the book is identified by its filename, not by this. Two books may not share an ISBN."
      - name: publisher
        label: Publisher
        widget: string
        required: false
        hint: "Publisher of the edition read."
      - name: publishedYear
        label: Edition year
        widget: number
        required: false
        value_type: int
        hint: "Year of the edition read."
      - name: firstPublishedYear
        label: First published
        widget: number
        required: false
        value_type: int
        hint: "Year the text first appeared, which for a reprint is not the edition year."
      - name: summary
        label: Summary
        widget: text
        required: false
        hint: "One or two sentences in AKSC's own words. Do not paste the publisher's blurb."
      - *topics_field
      - name: resources
        label: Where to read it
        widget: list
        required: false
        fields: *link_fields
      - *draft_field

  - name: authors
    label: Authors
    label_singular: Author
    icon: history_edu
    description: >-
      The people whose books the circle reads. A book names its authors from
      this list, so one author carries every book of theirs and has a page of
      their own. Add the author here before adding their first book.
    folder: cms/content/authors
    path: "{{slug}}/index"
    media_folder: /cms/content/authors/{{slug}}
    public_folder: /media/authors/{{slug}}
    create: true
    # See the note on `speakers`: an author is named by `name`, not `title`.
    identifier_field: name
    slug: "{{slug}}"
    preview_path: /authors/{{slug}}/
    sortable_fields: [name]
    summary: "{{name}}"
    thumbnail: portrait.src
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - name: name
        label: Name
        widget: string
        hint: "As a byline should print it: “bell hooks”, “B. R. Ambedkar”."
      - name: aliases
        label: Other spellings
        widget: list
        required: false
        field: { name: alias, label: Spelling, widget: string }
        hint: "Other names this author is listed under — “Kancha Ilaiah Shepherd” for “Kancha Ilaiah”. They are searchable when picking an author for a book, so a second spelling does not become a second author."
      - name: bio
        label: Biography
        widget: text
        required: false
        hint: Separate paragraphs with a blank line. Leave blank if you have none to write yet.
      - name: portrait
        label: Portrait
        widget: object
        required: false
        collapsed: true
        hint: "The photograph the author's page opens with. An author with none opens on their name instead."
        fields:
          - <<: *local_image
            hint: "Upload a portrait. Only use a photograph AKSC may publish — either one we hold, or one whose licence allows it, credited below."
          - {
              name: alt,
              label: Alternative text,
              widget: string,
              hint: Describe the person and setting rather than repeating their name.,
            }
          - name: credit
            label: Credit
            widget: object
            required: false
            collapsed: true
            hint: "Required for anyone else's photograph, including a Wikimedia Commons one. It prints under the picture. Leave the whole section empty only for a photograph AKSC itself holds."
            fields:
              - {
                  name: creator,
                  label: Photographer,
                  widget: string,
                  hint: "Whom the licence asks you to name — “Alex Lozupone (Tduk) / Wikimedia Commons”.",
                }
              - {
                  name: sourceUrl,
                  label: Source page,
                  widget: string,
                  hint: "The page the file came from, which is where its licence is stated.",
                }
              - {
                  name: license,
                  label: Licence,
                  widget: string,
                  hint: "As the source names it — “CC BY-SA 4.0”, or “Public domain”.",
                }
              - {
                  name: licenseUrl,
                  label: Licence deed,
                  widget: string,
                  required: false,
                  hint: "A link to the licence text. Leave blank for public domain, which has none.",
                }
              - {
                  name: note,
                  label: What was done to it,
                  widget: string,
                  required: false,
                  hint: "Any change you made to the file before uploading, such as “cropped”. The page already says it recoloured the picture.",
                }
      - *external_source
      - *draft_field

  - name: book-readings
    label: Book Readings
    label_singular: Book Reading
    icon: menu_book
    description: Scheduled and past readings, newest first.
    folder: cms/content/book-readings
    path: "{{slug}}/index"
    create: true
    # Not `{{year}}-{{month}}-{{day}}-{{slug}}`. Those tags are the date the
    # entry is created, never the `date` field, so writing up a sitting held in
    # 2024 would file it under the day someone got round to typing it, and a
    # reading whose date nobody recorded would be stamped with today's. The
    # title already carries what tells one sitting from another — a chapter
    # range, or "continued" and "revisited" for a book the circle came back to
    # — so it distinguishes them without dating the address.
    slug: "{{slug}}"
    preview_path: /book-readings/{{slug}}/
    media_folder: /cms/content/book-readings/{{slug}}
    public_folder: /media/book-readings/{{slug}}
    sortable_fields: [date, title]
    thumbnail: posters.*.src
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        label: Date and time (Pacific)
        widget: datetime
        input_timezone: America/Los_Angeles
        output_utc: true
        hint: >-
          Enter the Pacific time announced for the session, regardless of
          your computer's timezone. Daylight saving time is automatic; the
          saved value includes Z (UTC), and the site displays Pacific time.
      - name: location
        label: Location
        widget: string
        hint: "Where the session met, or how to join it when it is held online."
      - name: book
        label: Book
        widget: relation
        required: false
        collection: books
        value_field: "{{slug}}"
        search_fields: [title, isbn, authors.*]
        display_fields: [title, authors.*]
        hint: "Pick the book by title. Leave empty for a session built on articles or papers rather than one book."
      - name: participants
        label: Participants
        widget: list
        required: false
        field: { name: name, label: Name, widget: string }
      - {
          name: registrationUrl,
          label: Registration URL,
          widget: string,
          required: false,
        }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the readings index and in search results.
      - *topics_field
      - name: resources
        label: What we read
        widget: list
        required: false
        fields: *link_fields
      - name: heroImage
        label: Hero image
        widget: object
        required: false
        collapsed: true
        fields: *hero_image_fields
      - name: posters
        label: Posters and flyers
        label_singular: Poster or flyer
        widget: list
        required: false
        summary: "{{fields.caption}}"
        fields: *poster_fields
      - *external_source
      - { name: featured, label: Featured, widget: boolean, default: false }
      - *draft_field
      - { name: body, label: Details, widget: markdown, required: false }

  - name: general-body-meetings
    label: General Body Meetings
    label_singular: General Body Meeting
    icon: gavel
    description: >-
      One record per annual General Body meeting, holding the papers it
      published. A meeting always submits a report, and adopts resolutions only
      when there are any. Upload each PDF here; it is committed with the entry.
    folder: cms/content/general-body-meetings
    path: "{{slug}}/index"
    create: true
    # `{{year}}` would be the year the record was typed, and these are minuted
    # years afterwards, so the meeting's own `date` is read instead.
    slug: "{{fields.edition}}-general-body-meeting-{{date | date('YYYY')}}"
    preview_path: /organization/general-body/#general-body-meetings
    media_folder: /cms/content/general-body-meetings/{{slug}}
    public_folder: /media/general-body-meetings/{{slug}}
    sortable_fields: [edition, date]
    summary: "General Body {{fields.edition}} — {{date | date('YYYY')}}"
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - name: edition
        label: Which meeting
        widget: number
        value_type: int
        min: 1
        hint: "Counting from the first in 2017. The page titles itself from this, for example 6 becomes “6th General Body Meeting”."
      - name: date
        <<: *calendar_date
        label: Date
      - name: datePrecision
        label: Date precision
        widget: select
        default: day
        options:
          - { label: Exact day, value: day }
          - { label: Month only, value: month }
        hint: "Choose month only when the record names a month but no day, so the page does not print a day that was never recorded."
      - name: location
        label: Location
        widget: string
        hint: "Where it was held, or “Online” for a meeting held virtually."
      - name: papers
        label: Papers
        widget: list
        label_singular: Paper
        summary: "{{fields.kind}}"
        fields:
          - name: kind
            label: Kind
            widget: select
            options:
              - { label: Report, value: report }
              - { label: Resolutions, value: resolutions }
          - name: file
            label: PDF
            widget: file
            accept: .pdf
            choose_url: false
            pattern:
              - "^(?:$|undefined|null|(?:/media/(?:shared/(?:[a-z0-9_~-]+/)*|[a-z0-9_~-]+/[a-z0-9_~-]+/))?[a-z0-9_~-]+\\.pdf)$"
              - Choose a PDF from this site's media library, not an image or remote URL.
            media_libraries: *repository_media
            hint: "Upload the PDF itself. It is committed to the repository and served directly from this site."
          - name: pageCount
            label: Pages
            widget: number
            required: false
            value_type: int
            min: 1
            hint: "Shown beside the link so a reader knows the size of the download before opening it."
      - *external_source
      - *draft_field

  # Drawn work. A comic and a toolkit scenario are both a titled sequence of
  # panels, and both ask the same two things of whoever publishes one: describe
  # the drawing, and write out the words drawn inside it. A comic that carries
  # neither is closed to a screen reader, to translation, and to search, so the
  # panel list asks for both every time.
  #
  # Panels are uploaded into the repository rather than to a bucket, so a
  # published comic is a file this site serves and cannot be broken by somebody
  # else's host going away.
  - name: comics
    label: Comics
    label_singular: Comic
    icon: draw
    description: >-
      Illustrated comics, read panel by panel. Upload the panels in reading
      order; the first one is the cover shown on the comics index.
    folder: cms/content/comics
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    preview_path: /comics/{{slug}}/
    media_folder: /cms/content/comics/{{slug}}
    public_folder: /media/comics/{{slug}}
    sortable_fields: [date, title]
    summary: "{{title}}"
    # Panel one, which the collection already treats as the cover.
    thumbnail: panels.*.src
    view_filters:
      - { label: Featured, field: featured, pattern: true }
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - name: date
        <<: *calendar_date
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the comics index and in search results.
      - name: credits
        label: Credits
        label_singular: Credit
        widget: list
        summary: "{{fields.name}}"
        hint: "Everyone whose work is in the comic. A comic is never published without a credit."
        fields: &credit_fields
          - { name: name, label: Name, widget: string }
          - {
              name: role,
              label: Role,
              widget: string,
              required: false,
              hint: "For example Art, Script, or Art and script.",
            }
          - {
              name: url,
              label: Link,
              widget: string,
              required: false,
              hint: "Where readers can find more of their work.",
            }
      - *topics_field
      - name: contentNote
        label: Content note
        widget: string
        required: false
        hint: "Shown before the comic starts. Use it when a comic depicts violence or reproduces a slur."
      - name: panels
        label: Panels
        label_singular: Panel
        widget: list
        summary: "{{fields.alt}}"
        hint: "In reading order. The first panel is used as the cover."
        fields: &panel_fields
          - <<: *local_image
            label: Panel image
            hint: "Square panels at least 1140 pixels wide read best. Keep the artwork in its original colors."
          - name: alt
            label: Alternative text
            widget: string
            hint: "Describe the drawing: who is in it, where they are, and what they are doing. The words in the panel go in the transcript below, so do not repeat them here."
          - name: transcript
            label: Transcript
            widget: text
            required: false
            hint: "Every word drawn in the panel, in reading order, one line per bubble. Write “Aish: Hmmm.” to name who is speaking."
      - *external_source
      - { name: featured, label: Featured, widget: boolean, default: false }
      - *draft_field

  - name: toolkit-scenarios
    label: Toolkit Scenarios
    label_singular: Scenario
    icon: forum
    description: >-
      Illustrated scenarios in the anti-caste toolkit. Each is a short situation
      that ends in a question to the reader, ordered by hand rather than by date
      because a playbook is read in the order its authors chose.
    folder: cms/content/toolkit-scenarios
    path: "{{slug}}/index"
    create: true
    slug: "{{slug}}"
    preview_path: /anti-caste-toolkit/#{{slug}}
    media_folder: /cms/content/toolkit-scenarios/{{slug}}
    public_folder: /media/toolkit-scenarios/{{slug}}
    sortable_fields: [order, title]
    summary: "{{order}}. {{title}}"
    thumbnail: panels.*.src
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
    fields:
      - { name: title, label: Title, widget: string }
      - name: order
        label: Position in the playbook
        widget: number
        value_type: int
        min: 1
        hint: "Counting from 1. Scenarios are read in this order."
      - name: setting
        label: Setting
        widget: string
        hint: "Where it happens, in a few words, such as “A school cafeteria”."
      - name: summary
        label: Summary
        widget: text
        hint: One sentence saying what happens and what the reader is asked to consider.
      - name: prompt
        label: Question to the reader
        widget: text
        hint: "Printed under the panels, above the link to the form."
      - name: panels
        label: Panels
        label_singular: Panel
        widget: list
        summary: "{{fields.alt}}"
        hint: "In reading order."
        fields: *panel_fields
      - name: credits
        label: Credits
        label_singular: Credit
        widget: list
        required: false
        summary: "{{fields.name}}"
        fields: *credit_fields
      - *external_source
      - *draft_field

  - name: topics
    label: Topics
    label_singular: Topic
    icon: sell
    description: >-
      The subjects entries across the site are filed under. Anything with a
      Topics field picks from this list, so a topic added here is offered
      everywhere at once, and the chips a reader sees print the name given
      here. Renaming a topic renames it on every entry carrying it; deleting
      one leaves those entries showing its filename instead, so retire a topic
      only once nothing is filed under it.
    folder: cms/content/topics
    create: true
    identifier_field: label
    slug: "{{slug}}"
    # Terms have no standalone routes. Inspect their labels on linked entries.
    preview_path: /blog/
    sortable_fields: [label]
    summary: "{{label}}"
    fields:
      - name: label
        label: Name
        widget: string
        hint: "The name as it is printed on a chip — “Higher education”."
      - name: description
        label: What belongs here
        widget: text
        required: false
        hint: "One sentence, so two editors do not file the same work under two topics."

  - name: categories
    label: Categories
    label_singular: Category
    icon: shelves
    description: >-
      The shelves the blog is sorted into. Every article is filed under exactly
      one, and readers narrow the blog index by them. Add a category when
      several articles genuinely belong together; one category per article is
      no use to a reader.
    folder: cms/content/categories
    create: true
    identifier_field: label
    slug: "{{slug}}"
    preview_path: /blog/
    sortable_fields: [label]
    summary: "{{label}}"
    fields:
      - name: label
        label: Name
        widget: string
        hint: "The name as it is printed on the blog — “Books and Media”."
      - name: description
        label: What belongs here
        widget: text
        required: false
        hint: "One sentence saying what this shelf holds."
