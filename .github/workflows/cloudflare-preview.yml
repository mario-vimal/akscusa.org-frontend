name: Cloudflare preview

on:
  pull_request:

concurrency:
  group: cloudflare-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      # Non-secret configuration, so a repository variable rather than a secret.
      # The build bakes this into dist/admin/config.yml, so it has to be set
      # here, where the site is built, not on the deploy job.
      CMS_REPO: ${{ vars.CMS_REPO }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate project
        run: npm run validate

      - name: Upload static build
        uses: actions/upload-artifact@v4
        with:
          name: static-build
          path: dist
          if-no-files-found: error

  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download static build
        uses: actions/download-artifact@v4
        with:
          name: static-build
          path: dist

      - name: Deploy Cloudflare Pages preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          packageManager: npm
          wranglerVersion: 4.126.0
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ github.head_ref }}
            --commit-hash=${{ github.event.pull_request.head.sha }}
